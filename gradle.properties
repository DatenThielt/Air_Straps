# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod Properties
mod_id=airstraps
mod_name=Air Straps
mod_license=All Rights Reserved
mod_version=1.0
mod_authors=Daten
mod_description=Air Straps allows you to place blocks in mid-air using special strap items. Features 5 tiers of straps with varying ranges and durability.

# Minecraft and NeoForge Versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.1
neo_version_range=[21.1,21.2)
loader_version_range=[4,)

# Gradle Settings
org.gradle.caching=true
org.gradle.parallel=true
